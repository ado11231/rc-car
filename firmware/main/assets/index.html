<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>rc-car</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111;
    color: #888;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-around;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #status { position: fixed; top: 12px; left: 24px; font-size: 14px; }
  #status::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: #c33;
  }
  #status.on::before { background: #3c6; }
  .pad {
    position: relative;
    width: min(220px, 62vh); aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a1a;
  }
  .pad::before { content: ""; position: absolute; background: #2a2a2a; }
  .pad.v::before { inset: 14px calc(50% - 2px); }
  .pad.h::before { inset: calc(50% - 2px) 14px; }
  .knob {
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: #f80;
  }
  .knob.back { transition: transform .15s; }
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    align-items: center;
    justify-content: center;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
  <div id="status">disconnected</div>
  <div class="pad v" id="speed"><div class="knob"></div></div>
  <div class="pad h" id="steer"><div class="knob"></div></div>
  <div id="rotate">Turn your phone sideways</div>

<script>
const status = document.getElementById('status');
let x = 0, y = 0, ws;

function connect() {
  ws = new WebSocket('ws://' + (location.host || '192.168.4.1') + '/ws');
  ws.onopen = () => { status.textContent = 'connected'; status.className = 'on'; };
  ws.onclose = () => {
    status.textContent = 'disconnected';
    status.className = '';
    setTimeout(connect, 1000);
  };
}
connect();

function makeStick(pad, vertical, onChange) {
  const knob = pad.firstChild;
  let active = false;

  function move(e) {
    const r = pad.getBoundingClientRect();
    const travel = (r.width - knob.offsetWidth) / 2;
    let d = vertical ? e.clientY - r.top - r.height / 2 : e.clientX - r.left - r.width / 2;
    d = Math.max(-travel, Math.min(travel, d));
    knob.classList.remove('back');
    knob.style.transform = vertical ? `translateY(${d}px)` : `translateX(${d}px)`;
    onChange(Math.round((vertical ? -d : d) / travel * 100));
  }

  function release() {
    active = false;
    knob.classList.add('back');
    knob.style.transform = '';
    onChange(0);
  }

  pad.onpointerdown = e => { active = true; pad.setPointerCapture(e.pointerId); move(e); };
  pad.onpointermove = e => { if (active) move(e); };
  pad.onpointerup = pad.onpointercancel = release;
  return release;
}

const releaseSpeed = makeStick(document.getElementById('speed'), true, v => y = v);
const releaseSteer = makeStick(document.getElementById('steer'), false, v => x = v);

matchMedia('(orientation: portrait)').onchange = e => {
  if (e.matches) { releaseSpeed(); releaseSteer(); }
};

setInterval(() => {
  if (ws.readyState === WebSocket.OPEN) ws.send(x + ',' + y);
}, 50);
</script>
</body>
</html>
